[package]
name = "vob"
description = "Vector of Bits with Vec-like API and usize backing storage"
repository = "https://github.com/softdevteam/vob/"
version = "4.0.1"
authors = ["Laurence Tratt <laurie@tratt.net>"]
readme = "README.md"
license = "Apache-2.0/MIT"
categories = ["data-structures"]
edition = "2018"

[dependencies]
num-traits = "0.2.14"
serde = { version="1.0", features=["derive"], optional=true }
wincode = { version = "0.5.5", features=["derive"], optional=true }

[dev-dependencies]
criterion = "0.6"
rand = "0.9"
rand_pcg = "0.9"

[[bench]]
name = "vob"
harness = false

[[bench]]
name = "comparative"
harness = false

[features]
unsafe_internals = []
